<form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()">
  @if (errorMessage) {
    <div class="error-banner">
      {{errorMessage}}
    </div>
  }
  <div class="form-group">
    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      placeholder="email"
      [class.input-error]="email.touched && email.invalid"
    >
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <span class="error-text">Введите корректный email</span>
    }
  </div>
  <div class="form-group">
    <label for="password">Пароль</label>
    <input
    id="password" type="password" formControlName="password" placeholder="****">
    @if (form.controls.password.touched && form.controls.password.invalid){
      <span class="error-text">Введите пароль</span>
    }
  </div>
  <button type="submit" class="btn-primary" [disabled]="form.invalid || isLoading">
    @if (isLoading) {
      Вход
    } @else {
      Войти
    }
  </button>
  <div class="form-footer">
    <a routerLink="/auth/register">Нет аккаунта? Зарегистрироваться</a>
  </div>
</form>
